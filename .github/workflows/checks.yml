name: Application checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/model.txt
            requirements/web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install "torch>=2.1.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p test_chatbot.py
      - run: python -m unittest discover -s tests -p test_temporary_data.py
      - run: python -m unittest discover -s tests -p test_structure.py
      - run: node --check app/static/dashboard.js
      - run: node --check app/static/chatbot.js
      - run: node tests/js/test_chat_context.cjs
